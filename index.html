<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Liminal Rain</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: none; }
  #overlay {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 1.2em;
    font: 15px/1.4 ui-monospace, Menlo, monospace; color: #00ff41;
    text-shadow: 0 0 8px #00ff41; background: rgba(0, 0, 0, 0.55);
    cursor: pointer; user-select: none; letter-spacing: 0.15em;
  }
  #overlay .title { font-size: 28px; letter-spacing: 0.4em; }
  #overlay .hint { opacity: 0.6; font-size: 12px; }
  #overlay.hidden { display: none; }
  #overlay .setting { display: flex; gap: 0.6em; align-items: center; font-size: 13px; }
  #overlay .setting button {
    font: inherit; color: #00ff41; background: none; border: 1px solid rgba(0, 255, 65, 0.35);
    padding: 0.2em 0.7em; cursor: pointer; opacity: 0.6; text-shadow: inherit; letter-spacing: 0.1em;
  }
  #overlay .setting button:hover { opacity: 0.9; }
  #overlay .setting button.on { opacity: 1; border-color: #00ff41; box-shadow: 0 0 8px rgba(0, 255, 65, 0.5); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="overlay">
  <div class="title">LIMINAL RAIN</div>
  <div>click to enter</div>
  <div class="setting">rain density
    <button data-density="1">1&times;</button><button data-density="2">2&times;</button><button data-density="3">3&times;</button>
  </div>
  <div class="hint">WASD / arrows to move &middot; mouse to look &middot; esc to leave</div>
</div>
<script>
'use strict';
// Any startup failure shows on the welcome screen instead of leaving it silently stuck.
function showFatal(text) {
  const o = document.getElementById('overlay');
  o.classList.remove('hidden');
  o.innerHTML = '<div class="title">LIMINAL RAIN</div><div>something went wrong while starting</div>' +
    '<pre style="white-space:pre-wrap;max-width:80vw;opacity:0.8">' + String(text).replace(/</g, '&lt;') + '</pre>' +
    '<div class="hint">try a hard reload (Cmd/Ctrl + Shift + R)</div>';
}
window.addEventListener('error', (e) => { if (!window.LR) showFatal(e.message || e); });

function startGame() {
  const params = new URLSearchParams(location.search);
  const num = (k, d) => (params.has(k) ? Number(params.get(k)) : d);
  const STILL = params.get('still') === '1';

  // ---------- settings (main menu; remembered in localStorage, URL params override) ----------
  const DENSITIES = [1, 2, 3];
  const store = { get: (k) => { try { return localStorage.getItem(k); } catch (_) { return null; } },
                  set: (k, v) => { try { localStorage.setItem(k, v); } catch (_) { /* private mode */ } } };
  const pickDensity = (v) => (DENSITIES.includes(Number(v)) ? Number(v) : null);
  const settings = { density: pickDensity(params.get('density')) || pickDensity(store.get('lr.density')) || 2 };

  const canvas = document.getElementById('c');
  const overlay = document.getElementById('overlay');
  const gl = canvas.getContext('webgl2', { antialias: false, alpha: false });
  if (!gl) {
    overlay.innerHTML = '<div class="title">LIMINAL RAIN</div><div>WebGL2 is not available in this browser.</div>';
    return;
  }

  // ---------- state ----------
  const seed = num('seed', 1) | 0;
  const spawn = World.findSpawn(seed);
  const state = {
    pos: { x: num('x', spawn.x), y: num('y', spawn.y) },
    angle: num('a', 0),
    pitch: num('p', 0),     // radians, + looks up; clamped to +-PITCH_MAX
    time: num('t', 10),
    seed,
    bob: 0,
  };
  const WIN = 64; // map window size in tiles

  // ---------- glyph atlas ----------
  // Glyphs on a cols x rows grid of 64px cells, white on black, optionally mirrored (rain is).
  function glyphAtlas(chars, cols, rows, font, mirrored) {
    const S = 64;
    const c = document.createElement('canvas');
    c.width = cols * S; c.height = rows * S;
    const g = c.getContext('2d');
    g.fillStyle = '#000'; g.fillRect(0, 0, c.width, c.height);
    g.fillStyle = '#fff';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.font = font(S);
    for (let i = 0; i < cols * rows; i++) {
      const ch = chars[i % chars.length];
      const x = (i % cols) * S + S / 2, y = Math.floor(i / cols) * S + S / 2;
      g.save(); g.translate(x, y); if (mirrored) g.scale(-1, 1); g.fillText(ch, 0, 0); g.restore();
    }
    const tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, c);
    gl.generateMipmap(gl.TEXTURE_2D);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    return tex;
  }
  function buildAtlas() {
    const chars = [];
    for (let k = 0xff66; k <= 0xff9d; k++) chars.push(String.fromCharCode(k)); // half-width katakana
    chars.push(...'0123456789:・."=*+-<>¦|ZTJ'.split(''));
    return glyphAtlas(chars, 16, 16,
      (S) => `${Math.floor(S * 0.78)}px "Hiragino Sans", "Hiragino Kaku Gothic ProN", "MS Gothic", "Noto Sans JP", monospace`, true);
  }
  // Wall text: printable ASCII 32..126 on a 16x6 grid, not mirrored.
  function buildTextAtlas() {
    const chars = [];
    for (let k = 32; k < 128; k++) chars.push(String.fromCharCode(k));
    return glyphAtlas(chars, 16, 6, (S) => `${Math.floor(S * 0.82)}px Menlo, "DejaVu Sans Mono", Consolas, monospace`, false);
  }

  // ---------- wall text data ----------
  // Phrases, word-wrapped for the current density: row (p*4 + line), column = char (ASCII code).
  // Column 46 of a phrase's first row holds its longest line, column 47 its line count.
  const TEXT_ON = params.get('text') !== '0';
  const PH_W = 48;
  const phraseData = new Uint8Array(PH_W * World.PHRASES.length * 4);
  const phraseTex = gl.createTexture();
  let phraseDensity = 0;
  function buildPhrases(density) {
    if (density === phraseDensity) return;
    phraseDensity = density;
    const width = 15 * density - 2;  // leave a one-cell margin each side within a tile face
    phraseData.fill(0);
    World.PHRASES.forEach((text, p) => {
      const lines = World.wrapText(text, width);
      lines.forEach((line, l) => { for (let i = 0; i < line.length; i++) phraseData[(p * 4 + l) * PH_W + i] = line.charCodeAt(i); });
      phraseData[p * 4 * PH_W + 46] = Math.max(...lines.map((l) => l.length));
      phraseData[p * 4 * PH_W + 47] = lines.length;
    });
    gl.bindTexture(gl.TEXTURE_2D, phraseTex);
    gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.R8, PH_W, World.PHRASES.length * 4, 0, gl.RED, gl.UNSIGNED_BYTE, phraseData);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  }
  // Which face of each wall tile in the map window carries which phrase (RGBA = faces +x,-x,+y,-y).
  const faceData = new Uint8Array(WIN * WIN * 4);
  const faceTex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, faceTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, WIN, WIN, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);

  // ---------- map window ----------
  const mapData = new Uint8Array(WIN * WIN);
  const mapTex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, mapTex);
  gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.R8, WIN, WIN, 0, gl.RED, gl.UNSIGNED_BYTE, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  const origin = { x: 0, y: 0 };
  function recentre(force) {
    const cx = origin.x + WIN / 2, cy = origin.y + WIN / 2;
    if (!force && Math.abs(state.pos.x - cx) <= 12 && Math.abs(state.pos.y - cy) <= 12) return;
    origin.x = Math.floor(state.pos.x) - WIN / 2;
    origin.y = Math.floor(state.pos.y) - WIN / 2;
    if (STILL && params.has('ox')) { origin.x = num('ox', 0) | 0; origin.y = num('oy', 0) | 0; } // test hook
    World.fillWindow(origin.x, origin.y, WIN, seed, mapData);
    gl.bindTexture(gl.TEXTURE_2D, mapTex);
    gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, WIN, WIN, gl.RED, gl.UNSIGNED_BYTE, mapData);
    World.fillTextWindow(origin.x, origin.y, WIN, seed, faceData);
    gl.bindTexture(gl.TEXTURE_2D, faceTex);
    gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, WIN, WIN, gl.RGBA, gl.UNSIGNED_BYTE, faceData);
  }

  // ---------- shaders ----------
  const VS = `#version 300 es
  void main() {
    vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2);
    gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
  }`;

  const SCENE_FS = `#version 300 es
  precision highp float;
  precision highp int;
  uniform vec2 uRes;
  uniform vec2 uCam;       // camera, relative to window origin (tiles)
  uniform vec2 uFwd, uRight;
  uniform vec2 uPitchCS;   // cos, sin of pitch
  uniform float uEye;      // eye height (tiles)
  uniform float uTime;
  uniform int uDens;       // glyph density: cells per tile scale by this (1, 2, 3)
  uniform ivec2 uOrigin;   // window origin in world tiles
  uniform sampler2D uMap, uAtlas;
  uniform sampler2D uFaceText, uPhrases, uTextAtlas;
  uniform int uTextOn;
  out vec4 outColor;

  const float K = 1.3;
  const float WALL_H = 1.7;      // ceiling height in tiles           // projection scale (vertical half-FOV = atan(K/2))
  const int WIN = ${WIN};
  const vec3 GREEN = vec3(0.0, 1.0, 0.255);
  const vec3 HEAD  = vec3(0.85, 1.0, 0.88);
  const vec3 TEXT  = vec3(0.45, 1.0, 0.55);

  int byteAt(sampler2D t, ivec2 p) { return int(texelFetch(t, p, 0).r * 255.0 + 0.5); }

  // Wall text: returns true if this wall cell belongs to a text block (rain cleared there);
  // col gets the steady text glyph, if any. tile = wall tile (window coords), tface = face 0..3,
  // rnd = per-face random in [0,1), lc = column within the tile face, row = row from top.
  bool wallText(ivec2 tile, int tface, float rnd, int lc, int row, vec2 g, out vec3 col) {
    col = vec3(0.0);
    if (uTextOn == 0) return false;
    int tv = int(texelFetch(uFaceText, tile, 0)[tface] * 255.0 + 0.5);
    if (tv == 0) return false;
    int ph = tv - 1;
    int len = byteAt(uPhrases, ivec2(46, ph * 4));
    int lines = byteAt(uPhrases, ivec2(47, ph * 4));
    int cpt = 15 * uDens;
    int rows = int(WALL_H * 11.0 * float(uDens));
    int r0 = int((0.30 + 0.22 * rnd) * float(rows));  // around eye height
    int lr = row - r0, lcc = lc - (cpt - len) / 2;
    if (lr < -1 || lr > lines || lcc < -1 || lcc > len) return false;
    if (lr >= 0 && lr < lines && lcc >= 0 && lcc < len) {
      int code = byteAt(uPhrases, ivec2(lcc, ph * 4 + lr));
      if (code > 32) {
        int gi = code - 32;
        vec2 cell = vec2(float(gi % 16), float(gi / 16));
        vec2 sc = vec2(0.88) / vec2(16.0, 6.0);
        vec2 auv = (cell + 0.06) / vec2(16.0, 6.0) + fract(g) * sc;
        float glyph = textureGrad(uTextAtlas, auv, dFdx(g) * sc, dFdy(g) * sc).r;
        float fw = max(length(dFdx(g)), length(dFdy(g)));
        glyph = mix(glyph, 0.3, smoothstep(0.35, 1.2, fw));
        col = TEXT * glyph * 1.25;
      }
    }
    return true;
  }

  uint hu(uint x) { x ^= x >> 16; x *= 0x7feb352du; x ^= x >> 15; x *= 0x846ca68bu; x ^= x >> 16; return x; }
  uint h3(int a, int b, int c) { return hu(uint(a) ^ hu(uint(b) ^ hu(uint(c) + 0x9e3779b9u))); }
  float hf(uint h) { return float(h >> 8) / 16777216.0; }
  // Non-negative modulo with only defined (non-negative) operands for %.
  int pmod(int x, int m) { return x >= 0 ? x % m : m - 1 - ((-x - 1) % m); }

  bool wall(ivec2 t) {
    if (t.x < 0 || t.y < 0 || t.x >= WIN || t.y >= WIN) return false;
    return texelFetch(uMap, t, 0).r > 0.5;
  }

  // Rain on a surface. g = continuous cell coords (x = column, y = along flow),
  // ci = integer cell index (world-stable), key = surface id.
  // Returns rgb.
  vec3 rain(vec2 g, ivec2 ci, int key, float accent) {
    int col = ci.x;
    float trail = 0.0, head = 0.0;
    float D = float(uDens);
    for (int k = 0; k < 3; k++) {
      uint hc = h3(col, key, k);
      // Speeds, periods and trail lengths scale with density so streams keep the same
      // world-space speed and length; only the glyphs get finer.
      float speed = mix(5.0, 13.0, hf(hc)) * D;        // cells per second
      int P = (26 + int(hf(hu(hc + 1u)) * 34.0)) * uDens; // integer period: world-stable phase
      float period = float(P);
      float len = mix(6.0, 18.0, hf(hu(hc + 2u))) * D;
      float headPos = mod(uTime * speed + hf(hu(hc + 3u)) * period, period);
      // Phase from the world-integer row index, so re-centring the map window can't move drops.
      float d = mod(headPos - float(pmod(ci.y, P)), period);  // cells behind the head
      if (d < len) {
        trail = max(trail, exp(-d * (3.0 / len)));
        if (d < 1.0) head = 1.0;
      }
    }
    // Glyph choice: changes over time, faster inside trails.
    uint hcell = h3(ci.x, ci.y, key);
    float rate = mix(0.3, 2.0, hf(hcell)) + trail * 6.0;
    uint gi = h3(ci.x, ci.y, key + int(floor(uTime * rate + hf(hu(hcell)) * 7.0))) & 255u;
    vec2 tile = vec2(float(gi & 15u), float(gi >> 4));
    vec2 local = fract(g);
    vec2 auv = (tile + 0.08 + local * 0.84) / 16.0;
    vec2 gx = dFdx(g) * (0.84 / 16.0), gy = dFdy(g) * (0.84 / 16.0);
    float glyph = textureGrad(uAtlas, auv, gx, gy).r;
    // Far away: cells < ~2px, fade glyph shape to an even dim texture (no shimmer).
    float fw = max(length(dFdx(g)), length(dFdy(g)));
    glyph = mix(glyph, 0.32, smoothstep(0.35, 1.2, fw));
    float base = mix(0.10, 0.30, hf(hu(hcell + 7u))) * (1.0 + accent * 1.4);
    float b = glyph * (base + trail * (1.15 + accent * 0.5));
    return mix(GREEN * b, HEAD * glyph * 1.4, head * (1.0 - smoothstep(0.6, 1.4, fw) * 0.6));
  }

  void main() {
    vec2 uv = (gl_FragCoord.xy - 0.5 * uRes) / uRes.y;
    // 3D view ray, tilted by pitch: horizontal part rd, vertical part vy (per unit of t).
    float cp = uPitchCS.x, sp = uPitchCS.y;
    vec2 rd = uFwd * (cp - uv.y * K * sp) + uRight * (uv.x * K);
    float vy = sp + uv.y * K * cp;

    // --- DDA through the map window ---
    ivec2 m = ivec2(floor(uCam));
    vec2 dd = abs(1.0 / rd);
    ivec2 st = ivec2(sign(rd));
    vec2 sd = (sign(rd) * (vec2(m) - uCam) + sign(rd) * 0.5 + 0.5) * dd;
    int side = -1;
    float tw = 1e9;
    for (int i = 0; i < 48; i++) {
      if (sd.x < sd.y) { sd.x += dd.x; m.x += st.x; side = 0; }
      else             { sd.y += dd.y; m.y += st.y; side = 1; }
      if (wall(m)) { tw = side == 0 ? sd.x - dd.x : sd.y - dd.y; break; }
    }

    float rlen = length(vec3(rd, vy));
    vec3 col = vec3(0.0);
    float t;
    float hWall = uEye + vy * tw;
    if (side >= 0 && tw < 1e8 && hWall >= 0.0 && hWall <= WALL_H) {
      // --- wall ---
      t = tw;
      vec2 hit = uCam + rd * t;
      // Orient u so it always increases to the viewer's right (glyphs read the same on every face).
      float us = side == 0 ? (st.x > 0 ? 1.0 : -1.0) : (st.y > 0 ? -1.0 : 1.0);
      float u = us * (side == 0 ? hit.y : hit.x);
      int plane = side == 0 ? m.x + (st.x < 0 ? 1 : 0) + uOrigin.x : m.y + (st.y < 0 ? 1 : 0) + uOrigin.y;
      int face = side * 2 + (side == 0 ? (st.x > 0 ? 0 : 1) : (st.y > 0 ? 0 : 1));
      int uo = int(us) * (side == 0 ? uOrigin.y : uOrigin.x);
      vec2 g = vec2(u * 15.0, (WALL_H - hWall) * 11.0) * float(uDens);
      ivec2 ci = ivec2(floor(g)) + ivec2(uo * 15 * uDens, 0);
      // Vertical tile edges (corners, door jambs) and floor/ceiling seams read brighter.
      float fu = fract(u);
      float accent = max(1.0 - smoothstep(0.0, 0.07, min(fu, 1.0 - fu)),
                         1.0 - smoothstep(0.0, 0.05, min(hWall, WALL_H - hWall)));
      int tface = side == 0 ? (st.x > 0 ? 1 : 0) : (st.y > 0 ? 3 : 2);  // face hit: +x,-x,+y,-y
      int tileAlong = int(floor(u)) + uo;
      int lc = int(floor(g.x)) - int(floor(u)) * 15 * uDens;
      vec3 tcol;
      if (wallText(m, tface, hf(h3(plane, face, tileAlong)), lc, ci.y, g, tcol)) col = tcol;
      else col = rain(g, ci, plane * 4 + face, accent);
    } else if (vy < 0.0 || vy > 0.0) {
      // --- floor / ceiling ---
      bool floorHit = vy < 0.0;
      t = floorHit ? -uEye / vy : (WALL_H - uEye) / vy;
      vec2 p = uCam + rd * t;
      // Flow axis and direction per chunk, so a room's floor streams one way.
      ivec2 tileW = ivec2(floor(p)) + uOrigin;
      ivec2 chunk = ivec2(floor(vec2(tileW) / 8.0));
      uint hch = h3(chunk.x, chunk.y, floorHit ? 31 : 37);
      // In corridors, stream along the corridor; elsewhere the chunk decides.
      ivec2 mt = ivec2(floor(p));
      bool wy = wall(mt + ivec2(0, 1)) || wall(mt - ivec2(0, 1));
      bool wx = wall(mt + ivec2(1, 0)) || wall(mt - ivec2(1, 0));
      bool alongX = wy != wx ? wy : (hch & 1u) == 0u;
      float dir = (hch & 2u) == 0u ? 1.0 : -1.0;
      int fc = 11 * uDens;                        // floor/ceiling cells per tile
      float fcf = float(fc);
      vec2 g = alongX ? vec2(p.y * fcf, p.x * fcf * dir) : vec2(p.x * fcf, p.y * fcf * dir);
      ivec2 off = alongX ? ivec2(uOrigin.y * fc, uOrigin.x * fc * int(dir)) : ivec2(uOrigin.x * fc, uOrigin.y * fc * int(dir));
      ivec2 ci = ivec2(floor(g)) + off;
      // Floor seams along tile edges next to walls.
      col = rain(g, ci, (floorHit ? 1000003 : 2000003) + (alongX ? 0 : 7), 0.0) * 0.85;
    } else {
      t = 1e9;
    }

    float dist = t * rlen;
    float fog = mix(0.025, 1.0, exp(-dist * 0.11));
    outColor = vec4(col * fog, 1.0);
  }`;

  const BLUR_FS = `#version 300 es
  precision highp float;
  uniform sampler2D uSrc;
  uniform vec2 uOutSize;  // destination size in px
  uniform vec2 uDir;      // tap step in uv
  uniform float uLod;     // source mip level (2 = quarter res for the first pass)
  out vec4 outColor;
  void main() {
    vec2 uv = gl_FragCoord.xy / uOutSize;
    float w[5] = float[](0.227027, 0.1945946, 0.1216216, 0.054054, 0.016216);
    vec4 acc = textureLod(uSrc, uv, uLod) * w[0];
    for (int i = 1; i < 5; i++) {
      acc += textureLod(uSrc, uv + uDir * float(i) * 1.5, uLod) * w[i];
      acc += textureLod(uSrc, uv - uDir * float(i) * 1.5, uLod) * w[i];
    }
    outColor = acc;
  }`;

  const COMPOSITE_FS = `#version 300 es
  precision highp float;
  uniform sampler2D uScene, uBloom;
  uniform vec2 uRes;
  uniform float uBright;
  uniform vec4 uMotes[40];   // xy = screen px, z = radius px, w = alpha
  uniform int uMoteCount;
  out vec4 outColor;
  void main() {
    vec2 uv = gl_FragCoord.xy / uRes;
    vec3 col = texture(uScene, uv).rgb + texture(uBloom, uv).rgb * 1.4;
    for (int i = 0; i < 40; i++) {
      if (i >= uMoteCount) break;
      vec4 m = uMotes[i];
      float d = length(gl_FragCoord.xy - m.xy) / m.z;
      col += vec3(0.55, 1.0, 0.65) * m.w * exp(-d * d * 2.0);
    }
    vec2 q = uv - 0.5;
    col *= 1.0 - dot(q, q) * 0.6;   // gentle vignette
    outColor = vec4(col * uBright, 1.0);
  }`;


  function compile(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  }
  function program(fs) {
    const p = gl.createProgram();
    gl.attachShader(p, compile(gl.VERTEX_SHADER, VS));
    gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    const u = {};
    const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
    for (let i = 0; i < n; i++) { const name = gl.getActiveUniform(p, i).name; u[name] = gl.getUniformLocation(p, name); }
    return { p, u };
  }

  let scene, blur, composite;
  try { scene = program(SCENE_FS); blur = program(BLUR_FS); composite = program(COMPOSITE_FS); } catch (err) {
    overlay.classList.remove('hidden');
    overlay.innerHTML = '<pre style="white-space:pre-wrap;max-width:90vw">' + String(err.message).replace(/</g, '&lt;') + '</pre>';
    throw err;
  }
  const atlasTex = buildAtlas();
  const textAtlasTex = buildTextAtlas();
  const vao = gl.createVertexArray();

  // ---------- sizing ----------
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = Math.max(1, Math.floor(innerWidth * dpr)), h = Math.max(1, Math.floor(innerHeight * dpr));
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  }
  window.addEventListener('resize', resize);

  function renderScene(fbo) {
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.useProgram(scene.p);
    const fwd = [Math.cos(state.angle), Math.sin(state.angle)];
    gl.uniform2f(scene.u.uRes, canvas.width, canvas.height);
    gl.uniform2f(scene.u.uCam, state.pos.x - origin.x, state.pos.y - origin.y);
    gl.uniform2f(scene.u.uFwd, fwd[0], fwd[1]);
    gl.uniform2f(scene.u.uRight, -fwd[1], fwd[0]);
    gl.uniform2f(scene.u.uPitchCS, Math.cos(state.pitch), Math.sin(state.pitch));
    gl.uniform1f(scene.u.uEye, 0.8 + 0.02 * Math.sin(state.bob));
    gl.uniform1f(scene.u.uTime, state.time);
    gl.uniform1i(scene.u.uDens, settings.density);
    buildPhrases(settings.density);
    gl.uniform1i(scene.u.uTextOn, TEXT_ON ? 1 : 0);
    gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, faceTex); gl.uniform1i(scene.u.uFaceText, 2);
    gl.activeTexture(gl.TEXTURE3); gl.bindTexture(gl.TEXTURE_2D, phraseTex); gl.uniform1i(scene.u.uPhrases, 3);
    gl.activeTexture(gl.TEXTURE4); gl.bindTexture(gl.TEXTURE_2D, textAtlasTex); gl.uniform1i(scene.u.uTextAtlas, 4);
    gl.uniform2i(scene.u.uOrigin, origin.x, origin.y);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, mapTex); gl.uniform1i(scene.u.uMap, 0);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, atlasTex); gl.uniform1i(scene.u.uAtlas, 1);
    gl.bindVertexArray(vao);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }


  // ---------- post: bloom, motes, flicker ----------
  function makeTarget(w, h, mips) {
    const tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, mips ? gl.LINEAR_MIPMAP_LINEAR : gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    const fbo = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    return { tex, fbo, w, h };
  }
  function freeTarget(t) { if (t) { gl.deleteTexture(t.tex); gl.deleteFramebuffer(t.fbo); } }

  let targets = null;
  function ensureTargets() {
    const w = canvas.width, h = canvas.height;
    if (targets && targets.scene.w === w && targets.scene.h === h) return;
    if (targets) Object.values(targets).forEach(freeTarget);
    const bw = Math.max(1, w >> 2), bh = Math.max(1, h >> 2);
    targets = { scene: makeTarget(w, h, true), a: makeTarget(bw, bh), b: makeTarget(bw, bh) };
  }

  function blurPass(src, dst, dx, dy, lod) {
    gl.bindFramebuffer(gl.FRAMEBUFFER, dst.fbo);
    gl.viewport(0, 0, dst.w, dst.h);
    gl.useProgram(blur.p);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, src.tex);
    gl.uniform1i(blur.u.uSrc, 0);
    gl.uniform2f(blur.u.uOutSize, dst.w, dst.h);
    gl.uniform2f(blur.u.uDir, dx / dst.w, dy / dst.h);
    gl.uniform1f(blur.u.uLod, lod);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  // Motes: faint specks of light drifting in the air around the viewer.
  const MOTES = 40, MOTE_R = 6;
  const mr = (i, k) => World.hash2(i, k, seed ^ 0x6d6f);
  // Motes live in world coordinates; each frame they wrap into a box centred on the viewer.
  const moteWrap = (v) => ((v + MOTE_R) % (2 * MOTE_R) + 2 * MOTE_R) % (2 * MOTE_R) - MOTE_R;
  const motes = Array.from({ length: MOTES }, (_, i) => ({
    x: (mr(i, 0) * 2 - 1) * MOTE_R, y: (mr(i, 1) * 2 - 1) * MOTE_R, h: 0.1 + mr(i, 2) * 1.5,
    vx: (mr(i, 3) - 0.5) * 0.08, vy: (mr(i, 4) - 0.5) * 0.08, vh: (mr(i, 5) - 0.5) * 0.04,
    a: 0.25 + mr(i, 6) * 0.35,
  }));
  const moteData = new Float32Array(MOTES * 4);
  function lineOfSight(ax, ay, bx, by) {
    const d = Math.hypot(bx - ax, by - ay), n = Math.ceil(d / 0.2);
    for (let i = 1; i < n; i++) {
      const t = i / n;
      if (isWall(Math.floor(ax + (bx - ax) * t), Math.floor(ay + (by - ay) * t))) return false;
    }
    return true;
  }
  function updateMotes(dt) {
    const c = Math.cos(state.angle), s = Math.sin(state.angle);
    const eye = 0.8 + 0.02 * Math.sin(state.bob);
    let n = 0;
    for (const m of motes) {
      m.x += m.vx * dt; m.y += m.vy * dt; m.h += m.vh * dt;
      m.x = state.pos.x + moteWrap(m.x - state.pos.x);
      m.y = state.pos.y + moteWrap(m.y - state.pos.y);
      if (m.h < 0.05 || m.h > 1.65) m.vh = -m.vh;
      const wx = m.x, wy = m.y;
      m.lastW = [wx, wy];
      const rx = wx - state.pos.x, ry = wy - state.pos.y;
      // Same camera as the shader: forward/up tilted by pitch.
      const cp = Math.cos(state.pitch), sp = Math.sin(state.pitch);
      const zh = rx * c + ry * s, dh = m.h - eye;
      const z = zh * cp + dh * sp;                    // depth along the view direction
      if (z < 0.3) continue;
      const lateral = -rx * s + ry * c;
      const up = -zh * sp + dh * cp;
      const px = canvas.width / 2 + (lateral / (z * 1.3)) * canvas.height;
      const py = canvas.height / 2 + (up / (z * 1.3)) * canvas.height;
      if (px < -50 || px > canvas.width + 50 || py < -50 || py > canvas.height + 50) continue;
      if (isWall(Math.floor(wx), Math.floor(wy)) || !lineOfSight(state.pos.x, state.pos.y, wx, wy)) continue;
      const near = Math.min(1, 1.2 / z);
      moteData[n * 4] = px; moteData[n * 4 + 1] = py;
      moteData[n * 4 + 2] = canvas.height * (0.010 + 0.016 * (1 - near));  // far motes blur wider
      moteData[n * 4 + 3] = m.a * Math.exp(-z * 0.15);
      n++;
    }
    return n;
  }

  // Ambient flicker: every 8-20 s the light dips briefly.
  let nextFlicker = state.time + 8 + Math.random() * 12, dipUntil = -1;
  function brightness() {
    if (STILL) return 1;
    if (state.time >= nextFlicker) {
      dipUntil = state.time + 0.08 + Math.random() * 0.12;
      nextFlicker = state.time + 8 + Math.random() * 12;
    }
    return state.time < dipUntil ? 0.75 : 1;
  }

  function render(dt) {
    ensureTargets();
    renderScene(targets.scene.fbo);
    // Downsample + blur (two rounds for a wide, soft glow).
    gl.bindTexture(gl.TEXTURE_2D, targets.scene.tex);
    gl.generateMipmap(gl.TEXTURE_2D);
    blurPass(targets.scene, targets.a, 1, 0, 2);
    blurPass(targets.a, targets.b, 0, 1, 0);
    blurPass(targets.b, targets.a, 2, 0, 0);
    blurPass(targets.a, targets.b, 0, 2, 0);
    const n = updateMotes(dt);
    if (STILL) {  // test hooks
      document.body.dataset.motes = n;
      document.body.dataset.moteWorld = JSON.stringify(motes.map((m) => m.lastW.map((v) => +v.toFixed(4))));
    }
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.useProgram(composite.p);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, targets.scene.tex);
    gl.uniform1i(composite.u.uScene, 0);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, targets.b.tex);
    gl.uniform1i(composite.u.uBloom, 1);
    gl.uniform2f(composite.u.uRes, canvas.width, canvas.height);
    gl.uniform1f(composite.u.uBright, brightness());
    gl.uniform4fv(composite.u['uMotes[0]'], moteData);
    gl.uniform1i(composite.u.uMoteCount, n);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  // ---------- input ----------
  const keys = new Set();
  addEventListener('keydown', (e) => { keys.add(e.code); if (e.code.startsWith('Arrow')) e.preventDefault(); });
  addEventListener('keyup', (e) => keys.delete(e.code));
  addEventListener('blur', () => keys.clear());
  // Clicking always enters. Pointer lock is an enhancement: browsers refuse it in embedded or
  // sandboxed views and briefly after Esc, so without it plain mouse movement still turns the view.
  const locked = () => document.pointerLockElement === canvas;
  let entered = false;
  function enter() {
    entered = true;
    overlay.classList.add('hidden');
    try {
      const r = canvas.requestPointerLock && canvas.requestPointerLock();
      if (r && r.catch) r.catch(() => {});   // refused: stay in unlocked mouse-look mode
    } catch (_) { /* same */ }
  }
  function leave() {
    entered = false;
    mouseX = mouseY = -1;
    overlay.classList.remove('hidden');
  }
  overlay.addEventListener('click', enter);
  const densityButtons = overlay.querySelectorAll('[data-density]');
  function showDensity() { densityButtons.forEach((b) => b.classList.toggle('on', Number(b.dataset.density) === settings.density)); }
  densityButtons.forEach((b) => b.addEventListener('click', (e) => {
    e.stopPropagation();   // choosing a setting doesn't enter
    settings.density = Number(b.dataset.density);
    store.set('lr.density', String(settings.density));
    showDensity();
  }));
  showDensity();
  document.addEventListener('pointerlockerror', () => {});
  let wasLocked = false;
  document.addEventListener('pointerlockchange', () => {
    if (wasLocked && !locked()) leave();       // Esc released the lock
    wasLocked = locked();
  });
  addEventListener('keydown', (e) => { if (e.code === 'Escape' && entered && !locked()) leave(); });
  // Without pointer lock the cursor stops at the window edge, so resting it near an edge keeps
  // turning or tilting (faster the closer it is) — full look-around either way.
  const PITCH_MAX = 1.45;  // ~83 degrees: look at the ceiling/floor without flipping over
  const addPitch = (d) => { state.pitch = Math.max(-PITCH_MAX, Math.min(PITCH_MAX, state.pitch + d)); };
  let mouseX = -1, mouseY = -1;
  addEventListener('mousemove', (e) => {
    mouseX = e.clientX; mouseY = e.clientY;
    if (entered) { state.angle += e.movementX * 0.0025; addPitch(-e.movementY * 0.0025); }
  });
  document.addEventListener('mouseleave', () => { mouseX = mouseY = -1; });
  function edgeTurn(dt) {
    if (!entered || locked() || mouseX < 0) return;
    const zx = innerWidth * 0.12, zy = innerHeight * 0.12;
    if (mouseX < zx) state.angle -= 2.4 * dt * (1 - mouseX / zx);
    else if (mouseX > innerWidth - zx) state.angle += 2.4 * dt * (1 - (innerWidth - mouseX) / zx);
    if (mouseY < zy) addPitch(1.6 * dt * (1 - mouseY / zy));
    else if (mouseY > innerHeight - zy) addPitch(-1.6 * dt * (1 - (innerHeight - mouseY) / zy));
  }
  if (STILL) overlay.classList.add('hidden');

  const isWall = (tx, ty) => World.tileAt(tx, ty, seed) === 1;
  function update(dt) {
    const k = (c) => keys.has(c);
    const fwdIn = (k('KeyW') || k('ArrowUp') ? 1 : 0) - (k('KeyS') || k('ArrowDown') ? 1 : 0);
    const strafe = (k('KeyD') ? 1 : 0) - (k('KeyA') ? 1 : 0)
      + (locked() ? (k('ArrowRight') ? 1 : 0) - (k('ArrowLeft') ? 1 : 0) : 0);
    if (!locked()) state.angle += ((k('ArrowRight') ? 1 : 0) - (k('ArrowLeft') ? 1 : 0)) * 2.2 * dt;
    edgeTurn(dt);
    const c = Math.cos(state.angle), s = Math.sin(state.angle);
    let dx = c * fwdIn - s * strafe, dy = s * fwdIn + c * strafe;
    const len = Math.hypot(dx, dy);
    if (len > 0) {
      dx = (dx / len) * 2.2 * dt; dy = (dy / len) * 2.2 * dt;
      state.pos = World.moveWithCollision(state.pos, dx, dy, 0.2, isWall);
      state.bob += dt * 1.6 * Math.PI * 2;
    }
  }

  // ---------- loop ----------
  resize();
  recentre(true);
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
    last = now;
    if (!STILL) { state.time += dt; update(dt); recentre(false); }
    resize();
    render(STILL ? 0 : dt);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  window.LR = { state, settings, renderScene, render, resize, gl, canvas };
}

// Load the world logic with a fresh URL every time: some servers (e.g. T3 Code's preview) let the
// browser cache files for an hour, and a normal reload would pair a new page with an old world.js.
(() => {
  const s = document.createElement('script');
  s.src = 'src/world.js?v=' + Date.now();
  s.onload = startGame;
  s.onerror = () => showFatal('could not load src/world.js');
  document.head.appendChild(s);
})();
</script>
</body>
</html>
